name: tablemax-test

services:
  pg16:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: tablemax
      POSTGRES_DB: tablemax_test
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tablemax_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql8:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tablemax
      MYSQL_DATABASE: tablemax_test
    ports:
      - "127.0.0.1:33061:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptablemax --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb11:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: tablemax
      MARIADB_DATABASE: tablemax_test
    ports:
      - "127.0.0.1:33062:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
