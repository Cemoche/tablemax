    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#1b3f8f"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
